# staticcheck configuration for xQuakShell.
#
# The gate keeps every correctness check (SA*) and the quickfix set (QF*). What is
# switched off below is switched off for a stated reason, not to make the build green:
# a rule that fires on code we intend to keep writing produces noise that trains people
# to skim the report, which is how the one real SA* finding gets missed.
checks = [
    "all",

    # Style-only naming and doc-comment rules. Nothing here is a defect; the codebase
    # already documents deliberately and does not follow the initialism convention.
    "-ST1000", # at least one file in a package should have a package comment
    "-ST1003", # poorly chosen identifier (Url vs URL, Id vs ID)
    "-ST1005", # error strings should not end with punctuation
    "-ST1020", # comment on exported function should be of the form "..."
    "-ST1021", # comment on exported type should be of the form "..."
    "-ST1022", # comment on exported var/const should be of the form "..."

    # Fires on the discovery/audit forgery tests, whose fixtures must contain literal
    # bidi and control characters — escaping them is exactly what those tests exist to
    # prove the sanitizer handles, and would hide the input from a reader.
    "-ST1018",

    # Unused-code detection is unreliable in this repo: platform behaviour is split
    # across build-tagged files (_windows.go / _linux.go / _other.go), and U1000 reports
    # the variant that is not in the current build as dead. Enforcing it would mean
    # deleting code that is live on another GOOS.
    "-U1000",

    # Suggests replacing a field-by-field literal with a struct conversion between two
    # coincidentally-identical types. The literal is the more readable form and keeps
    # compiling if the two types later diverge, which is the likelier direction here.
    "-S1016",
]

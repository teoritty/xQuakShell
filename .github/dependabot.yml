version: 2

# Monthly, on the first of the month at 06:00 UTC, the hour of the Security workflow's cron.
#
# Every dependency PR runs the full Test and Security workflows, the Windows leg included, and the
# account behind this repository was suspended once already over the volume of automated activity.
# So version updates arrive monthly, at most two open PRs per ecosystem, with every minor and patch
# bump of an ecosystem folded into one PR. Security updates are not held to the schedule - they open
# when an advisory lands - but they too arrive as one grouped PR per ecosystem.
#
# Nothing here is auto-merged and nothing should be. A lockfile plus a read of the diff is
# what makes a dependency bump safer than the CVE it closes; automation that merges without
# either gives up the only defence this repo has against a bad upstream release.
updates:
  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  # No ignores. The direct dependencies here are a minor or two behind at most, and every one
  # of them is either the SSH/SFTP stack or the vault's storage engine - the parts of this
  # product where a fixed upstream bug is worth having.
  #
  # One bump will arrive red, and that is the design working: the Wails version is written down
  # in five places - go.mod, two `cmd/wails@` pins in release.yml (one per build job),
  # WAILS_VERSION in the Makefile, and the README badge. Dependabot edits only go.mod, and
  # test/unit/release fails on any of the rest disagreeing except the badge, which no test
  # guards because a badge is a claim rather than a build input.
  #
  # The red test IS the reminder to edit the others; do that in the PR rather than adding an
  # ignore rule here, because an ignore would trade a visible red check for silently never
  # hearing about a new Wails.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      # These are versioned and released together upstream; separate PRs for them would be
      # three reviews of one decision.
      golang-x:
        patterns:
          - "golang.org/x/*"
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Frontend npm
  # ---------------------------------------------------------------------------
  # Only /frontend. frontend/wailsjs/runtime/package.json is generated by Wails, has no
  # lockfile, and is excluded from `npm audit` in security.yml for the same reason - it is not
  # a project anyone here maintains.
  #
  # Majors were ignored here until the tree caught up, and are not any more. The ignore existed
  # because the build tooling was 3-6 majors behind - vite 3, typescript 4,
  # vite-plugin-svelte 1 - so every major PR would have been unmergeable on arrival: Svelte
  # 3 -> 5 was a coordinated migration of five packages, not a bump. A permanent wall of red
  # PRs is how a team learns to ignore the label.
  #
  # That migration has landed. Svelte 5, vite 8, typescript 5.9, and `npm audit --omit=dev`
  # reports zero. The blanket ignore now has the opposite effect: it would hold the tree back
  # from the state it was added to reach.
  #
  # If a major wall ever forms again, the answer is the same as it was - ignore majors for as
  # long as the migration takes, with the plan written down, and lift it in the commit that
  # makes the tree current. Not: leave it on because it is quiet.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      # Both families move as a set upstream and are meaningless to review one package at a
      # time - a codemirror editor with mismatched @codemirror/state and /view does not work.
      codemirror:
        patterns:
          - "codemirror"
          - "@codemirror/*"
      xterm:
        patterns:
          - "@xterm/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  # One grouped PR for every action. These are pinned by major tag, so an update here is
  # usually a tag repoint rather than a behaviour change, and reviewing them one at a time
  # costs more attention than it returns. The version-skew warning that a mixed
  # codeql-action state produces is exactly what this is meant to keep from coming back.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

version: 2

# Weekly on Monday morning UTC, matching the schedule of the Security workflow's cron. A
# dependency PR and the scheduled vulnerability scan that might explain it then land in the
# same window rather than a few days apart.
#
# Nothing here is auto-merged and nothing should be. A lockfile plus a read of the diff is
# what makes a dependency bump safer than the CVE it closes; automation that merges without
# either gives up the only defence this repo has against a bad upstream release.
updates:
  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  # No ignores. The direct dependencies here are a minor or two behind at most, and every one
  # of them is either the SSH/SFTP stack or the vault's storage engine - the parts of this
  # product where a fixed upstream bug is worth having.
  #
  # One bump will arrive red, and that is the design working: the Wails version lives in three
  # places - go.mod, the `cmd/wails@` pin in release.yml, and WAILS_VERSION in the Makefile -
  # and test/unit/release's TestWailsCLIIsPinnedToTheGoModVersion fails when they disagree.
  # Dependabot only edits the first. The red test IS the reminder to edit the other two; do
  # that in the PR rather than adding an ignore rule here, because an ignore would trade a
  # visible red check for silently never hearing about a new Wails.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # These are versioned and released together upstream; separate PRs for them would be
      # three reviews of one decision.
      golang-x:
        patterns:
          - "golang.org/x/*"

  # ---------------------------------------------------------------------------
  # Frontend npm
  # ---------------------------------------------------------------------------
  # Only /frontend. frontend/wailsjs/runtime/package.json is generated by Wails, has no
  # lockfile, and is excluded from `npm audit` in security.yml for the same reason - it is not
  # a project anyone here maintains.
  #
  # Majors are ignored deliberately, and this is a scope decision rather than an attempt to
  # look green. The build tooling is 3-6 majors behind (vite 3, typescript 4,
  # vite-plugin-svelte 1), and every one of those PRs would be unmergeable on arrival: the
  # Svelte 3 -> 5 move is a coordinated migration of five packages, not a bump. Left
  # unignored they would arrive as a permanent wall of red PRs and teach everyone to ignore
  # the label. See .claude/dependency-strategy.md for the migration plan; remove this ignore
  # when that lands.
  #
  # What ships to a user is a different population and is already current: dompurify, marked,
  # xterm and codemirror are all within a patch or minor, so patch/minor updates here are the
  # ones that actually reach the product.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Both families move as a set upstream and are meaningless to review one package at a
      # time - a codemirror editor with mismatched @codemirror/state and /view does not work.
      codemirror:
        patterns:
          - "codemirror"
          - "@codemirror/*"
      xterm:
        patterns:
          - "@xterm/*"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  # One grouped PR for every action. These are pinned by major tag, so an update here is
  # usually a tag repoint rather than a behaviour change, and reviewing them one at a time
  # costs more attention than it returns. The version-skew warning that a mixed
  # codeql-action state produces is exactly what this is meant to keep from coming back.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

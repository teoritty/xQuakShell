name: Release

on:
  push:
    tags:
      - 'v*'
  # A tag is permanent and a published release is public, so there has to be a way to prove the
  # build works before creating either. Run manually to build every archive and keep them as
  # workflow artifacts; the publish job below refuses to run outside a tag, so a manual run can
  # never create a release.
  workflow_dispatch:

# Build jobs never need write access; only the publish job creates the release.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned, not @latest: two runs of the same tag must produce the same binary.
      # Kept equal to the wails/v2 version in go.mod (asserted by test/unit/release).
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Derive version
        shell: pwsh
        run: |
          # Archive names keep the leading "v"; the version compiled into the binary drops it.
          # On a manual run there is no tag, and ref_name would be the branch: name those archives
          # so they cannot be mistaken for a build of a release.
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $tag = "dryrun-" + "${{ github.sha }}".Substring(0, 7) }
          $version = $tag -replace '^v', ''
          "TAG=$tag"         | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -ldflags "-X xquakshell/internal/presentation/wails.AppVersion=$env:VERSION"

      # Both archives unpack into one folder named after themselves rather than scattering an exe
      # and a 250 MB runtime folder into whatever directory they were opened in. The app keeps its
      # vault, audit log and plugins in data\ next to the executable, so that folder is the
      # installation and has to stay together.
      - name: Package portable (no WebView2)
        shell: pwsh
        run: |
          $name = "xQuakShell-$env:TAG-windows-amd64-portable"
          New-Item -ItemType Directory -Path dist, "stage/$name" -Force | Out-Null
          Copy-Item "build/bin/xQuakShell.exe" "stage/$name/"
          Copy-Item "packaging/windows/README.md" "stage/$name/README.md"
          Copy-Item "LICENSE" "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"

      # Fetches the x64 fixed runtime, verifies it is the architecture this build needs and that
      # Microsoft signed it, and fails the release if either is not true.
      - name: Download WebView2 Fixed Runtime
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/download_webview2.ps1

      - name: Package portable (with WebView2)
        shell: pwsh
        run: |
          $name = "xQuakShell-$env:TAG-windows-amd64-portable-webview2"
          New-Item -ItemType Directory -Path "stage/$name" -Force | Out-Null
          Copy-Item "build/bin/xQuakShell.exe" "stage/$name/"
          Copy-Item "build/bin/WebView2" "stage/$name/WebView2" -Recurse
          Copy-Item "packaging/windows/README.md" "stage/$name/README.md"
          Copy-Item "LICENSE" "stage/$name/"
          # The file Wails resolves at startup. If it is missing the app exits without a window,
          # which is exactly the failure this archive exists to prevent — so the release stops here
          # rather than shipping it.
          $clientDll = "stage/$name/WebView2/EBWebView/x64/EmbeddedBrowserWebView.dll"
          if (-not (Test-Path $clientDll)) { throw "Bundled runtime is missing $clientDll" }
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-archives
          path: dist/*.zip
          if-no-files-found: error

  # WebKitGTK is linked from the system and cannot be bundled the way WebView2 is on Windows, and
  # the 4.0 and 4.1 ABIs are not interchangeable: a binary built against one does not start against
  # the other. So the Linux side ships one archive per ABI rather than one archive that fails on
  # half the distributions.
  #
  # Both build on ubuntu-22.04, the oldest image still offered. The runner decides the glibc floor
  # of what it produces (2.35 here), and a binary built against a newer glibc will not run on an
  # older system — building the 4.1 variant on a newer image would raise that floor for no gain,
  # since 4.1 is available on 22.04 too. This image is deprecated from 2026-09-17 and unsupported
  # from 2027-04-17; when it goes, move to the oldest image then available and expect the 4.0
  # variant to go with it, as upstream retired that ABI in March 2026.
  linux:
    runs-on: ubuntu-22.04
    strategy:
      # One ABI failing must not cancel the other: a half-built release is easier to see than a
      # cancelled one.
      fail-fast: false
      matrix:
        include:
          - webkit: '4.0'
            dev_package: libwebkit2gtk-4.0-dev
            build_tags: ''
          - webkit: '4.1'
            dev_package: libwebkit2gtk-4.1-dev
            # Without this tag Wails links 4.0 regardless of what is installed.
            build_tags: '-tags webkit2_41'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ${{ matrix.dev_package }}

      # Pinned for the same reason as the Windows job: two runs of the same tag must agree.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Derive version
        run: |
          # Archive names keep the leading "v"; the version compiled into the binary drops it.
          # On a manual run there is no tag, and ref_name would be the branch: name those archives
          # so they cannot be mistaken for a build of a release.
          TAG="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then TAG="dryrun-$(echo "${{ github.sha }}" | cut -c1-7)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "NAME=xQuakShell-$TAG-linux-amd64-webkit${{ matrix.webkit }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          wails build -platform linux/amd64 -clean ${{ matrix.build_tags }} \
            -ldflags "-X xquakshell/internal/presentation/wails.AppVersion=$VERSION"

      # An ELF on its own has no icon, no menu entry and no explanation of which WebKitGTK it needs.
      # The archive carries the launcher, the desktop entry and the instructions with it.
      - name: Assemble archive
        run: |
          mkdir -p dist "stage/$NAME"
          cp build/bin/xQuakShell "stage/$NAME/"
          cp packaging/linux/xquakshell.sh "stage/$NAME/"
          cp packaging/linux/install-desktop-entry.sh "stage/$NAME/"
          cp packaging/linux/xquakshell.desktop "stage/$NAME/"
          cp packaging/linux/README.md "stage/$NAME/README.md"
          cp images/icon.png "stage/$NAME/icon.png"
          cp LICENSE "stage/$NAME/"
          # core.filemode is false in this repository and the scripts are tracked 0644, so the
          # executable bit does not survive checkout; tar would record exactly that.
          chmod +x "stage/$NAME/xQuakShell" "stage/$NAME/xquakshell.sh" "stage/$NAME/install-desktop-entry.sh"
          # -C keeps the staging path out of the archive: it unpacks into one directory named
          # after itself, never into the current one.
          tar -czf "dist/$NAME.tar.gz" -C stage "$NAME"
          tar -tzf "dist/$NAME.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-archives-webkit${{ matrix.webkit }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    # The only guard between a manual build check and a public release. Without it a
    # workflow_dispatch run would publish a release named after a branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No pattern filter: every archive any build job uploaded is published and checksummed,
      # so a new platform job cannot be added without its files being covered.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} dist/ \;
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: |
          # Runs before SHA256SUMS exists, so the glob cannot include the file being written.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Tagged with a suffix (v1.0.0-rc.1) -> Pre-release; clean tag (v1.0.0) -> Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

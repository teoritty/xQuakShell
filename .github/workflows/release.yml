name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform windows/amd64 -clean

      - name: Package portable (no WebView2)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "xQuakShell-$version-windows-amd64-portable.zip"
          Compress-Archive -Path "build/bin/xQuakShell.exe" -DestinationPath $zip
          echo "ZIP_LITE=$zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Download WebView2 Fixed Runtime
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/download_webview2.ps1

      - name: Package portable (with WebView2)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "xQuakShell-$version-windows-amd64-portable-webview2.zip"
          # весь build/bin: внутри архива будет xQuakShell.exe + WebView2/
          Compress-Archive -Path "build/bin/*" -DestinationPath $zip
          echo "ZIP_FULL=$zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($zip in @($env:ZIP_LITE, $env:ZIP_FULL)) {
            $lines += (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tagged with a suffix (v1.0.0-rc.1) -> Pre-release; clean tag (v1.0.0) -> Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            xQuakShell-*.zip
            SHA256SUMS
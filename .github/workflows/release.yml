name: Release

on:
  push:
    tags:
      - 'v*'

# Build jobs never need write access; only the publish job creates the release.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned, not @latest: two runs of the same tag must produce the same binary.
      # Kept equal to the wails/v2 version in go.mod (asserted by test/unit/release).
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Derive version
        shell: pwsh
        run: |
          # Archive names keep the leading "v"; the version compiled into the binary drops it.
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "TAG=$tag"         | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -ldflags "-X xquakshell/internal/presentation/wails.AppVersion=$env:VERSION"

      - name: Package portable (no WebView2)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "build/bin/xQuakShell.exe" `
            -DestinationPath "dist/xQuakShell-$env:TAG-windows-amd64-portable.zip"

      - name: Download WebView2 Fixed Runtime
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/download_webview2.ps1

      - name: Package portable (with WebView2)
        shell: pwsh
        run: |
          # Everything in build/bin: xQuakShell.exe + WebView2/
          Compress-Archive -Path "build/bin/*" `
            -DestinationPath "dist/xQuakShell-$env:TAG-windows-amd64-portable-webview2.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-archives
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No pattern filter: every archive any build job uploaded is published and checksummed,
      # so a new platform job cannot be added without its files being covered.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} dist/ \;
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: |
          # Runs before SHA256SUMS exists, so the glob cannot include the file being written.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tagged with a suffix (v1.0.0-rc.1) -> Pre-release; clean tag (v1.0.0) -> Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS

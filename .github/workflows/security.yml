name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  # A CVE against a dependency lands in the vulnerability database without any
  # commit to this repo, so pushes alone are not enough to find out about it.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required by upload-sarif

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.6.0
  GOSEC_VERSION: v2.28.0
  STATICCHECK_VERSION: v0.7.0

jobs:
  # All three Go tools type-check the packages, and the root package go:embed's
  # frontend/dist (gitignored). Keeping them in one job builds the frontend once
  # instead of three times.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Reports only vulnerabilities whose vulnerable symbols are actually
      # reachable from this code, so a finding here is worth acting on.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      # -no-fail so the SARIF is always written and uploaded; the gate step below
      # is what fails the build. Every step from here runs even if an earlier one
      # failed, so one run surfaces all findings instead of one tool at a time.
      #
      # Three rules are excluded repo-wide because they do not describe a defect in
      # an SSH/SFTP client, and per-site annotations would run to ~75 comments that
      # nobody would read. Everything else is annotated at the call site instead, so
      # a NEW offending call site still fails the build:
      #   G104 unhandled errors  - the convention here is deliberate best-effort
      #                            Close/Remove in cleanup and error paths; this
      #                            duplicates errcheck, not a security finding.
      #   G304 file inclusion    - the product IS a file manager; user-chosen paths
      #                            are the input. Containment is enforced by
      #                            internal/pkg/pathsafe (UnderRoot) and by the
      #                            test/unit/architecture/fs_boundaries.go gate.
      #   G103 unsafe.Pointer    - required to pass syscall arguments to
      #                            windows.OpenProcess / SetInformationJobObject.
      - name: gosec
        if: always()
        run: >
          go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          -no-fail -fmt sarif -out gosec.sarif
          -exclude-dir=test/fixtures -exclude-dir=frontend -exclude-dir=build
          -exclude=G104,G304,G103
          ./...

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Gate on gosec findings
        if: always()
        run: test "$(jq '[.runs[].results[]] | length' gosec.sarif)" -eq 0

      # `-f sarif` reports findings through the file, not the exit code (unlike the
      # default text format, which exits 1), so exit 1 is tolerated here and the gate
      # step below is what fails the build. Anything above that is a real tool failure
      # and must NOT be swallowed -- the old `|| true` turned a broken run into a
      # truncated file that then blew up two steps later.
      #
      # The jq pass exists because staticcheck omits the "results" key entirely on a
      # clean run. SARIF 2.1.0 allows that, but upload-sarif rejects it ("Missing
      # 'results' array in run") and `.runs[].results[]` iterates over null, so
      # normalise it to an empty array here rather than waiting on upstream.
      - name: staticcheck
        if: always()
        run: |
          set +e
          go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} \
            -f sarif ./... > staticcheck.raw.sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            cat staticcheck.raw.sarif
            exit "$status"
          fi
          jq '.runs |= map(.results = (.results // []))' staticcheck.raw.sarif > staticcheck.sarif

      - name: Upload staticcheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: staticcheck.sarif
          category: staticcheck

      - name: Gate on staticcheck findings
        if: always()
        run: test "$(jq '[.runs[].results[]] | length' staticcheck.sarif)" -eq 0

  # CodeQL's own engine, separate from the gosec/staticcheck SARIF uploads above.
  # JS/TS uses build-mode: none since CodeQL parses those sources directly.
  #
  # Go uses build-mode: manual for two reasons:
  #   1. go:embed needs frontend/dist built first, so autobuild's guessed build
  #      command would fail.
  #   2. The repo ships Windows-specific files (job objects, syscalls) gated
  #      behind `_windows.go` / `//go:build windows`. A single native build on
  #      ubuntu-latest only compiles the linux-tagged half of the tree, so
  #      CodeQL silently never sees the Windows-only code path. Rather than add
  #      a second, slower windows-latest runner, we cross-compile with
  #      GOOS=windows right here: the module has no cgo dependencies
  #      (modernc.org/sqlite is pure Go, no `import "C"` anywhere), so a
  #      Windows cross-build from Linux works cleanly. Manual build mode traces
  #      every command between init and analyze into one database, so both
  #      builds land in the same CodeQL database instead of needing a second
  #      matrix leg and a second category.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.language == 'go'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        if: matrix.language == 'go'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.25'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Native build first: covers unconditional files plus anything gated
      # behind //go:build linux (or no tag at all).
      - name: Build Go (native, linux)
        if: matrix.language == 'go'
        run: go build ./...

      # Second pass, same database: covers the Windows-only files the native
      # build above never touches. CGO_ENABLED=0 is required for cross-builds
      # anyway and matches how this module is already built (no cgo deps).
      - name: Build Go (cross, windows)
        if: matrix.language == 'go'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build ./...

      # `output:` keeps the SARIF on disk for the gate below. Upload still happens
      # (the action's default is `upload: always`), so the Security tab is
      # unaffected -- this only stops the results being write-only.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results

      # analyze exits 0 whatever it found, so until this step a CodeQL alert only
      # ever appeared in the Security tab and never turned a build red -- the same
      # hole the gosec and staticcheck gates in the `go` job above already close,
      # left open on the one tool with its own engine. Four alerts sat on main
      # through green pipelines.
      #
      # What this does and does not catch, because a green PR here is easy to
      # misread: CodeQL restricts most queries to the lines a pull request
      # touches, so on a `pull_request` run this fails what the PR INTRODUCES and
      # says nothing about what it inherits. The push-to-main run analyses the
      # whole tree and is what catches an inherited alert. Both are wanted; only
      # the second is exhaustive.
      #
      # The results are printed before failing because, unlike gosec and
      # staticcheck, nothing else in the job log names them.
      - name: Gate on CodeQL findings
        if: always()
        run: |
          shopt -s nullglob
          sarif=(codeql-results/*.sarif)
          if [ "${#sarif[@]}" -eq 0 ]; then
            echo "no CodeQL SARIF in codeql-results/ - analyze did not run to completion"
            exit 1
          fi
          count=$(jq -s '[.[].runs[].results[]] | length' "${sarif[@]}")
          if [ "$count" -ne 0 ]; then
            jq -rs '.[].runs[].results[]
              | "\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)\t\(.message.text)"' \
              "${sarif[@]}"
            echo "CodeQL reported $count finding(s) for ${{ matrix.language }}"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Scoped to frontend/ deliberately: frontend/wailsjs/runtime/package.json is
      # a generated, lockfile-less manifest and must not be audited.
      #
      # --omit=dev is a deliberate narrowing, not a way to dodge a red build. The one
      # high-severity advisory left in devDependencies is GHSA-67mh-4wv8-2f99 in the
      # esbuild bundled by vite 3: it lets a website talk to the vite DEV SERVER. This
      # app ships `npm run build` output embedded in the Go binary and never runs the
      # dev server for users, so it is a local-developer surface only, and clearing it
      # means migrating vite 3 -> 8 (five majors). Track that separately; do not raise
      # --audit-level to dodge it.
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Non-blocking, so the dev-dependency backlog stays visible in the job log
      # instead of quietly disappearing behind --omit=dev.
      - name: npm audit (all dependencies, informational)
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: npm audit
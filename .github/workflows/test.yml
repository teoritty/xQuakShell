name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Both operating systems this application ships on, because half of the plugin isolation only
  # exists on one of them. The AppContainer profile, its ACLs, the job object and the Windows arm of
  # the sandbox escape probe are Windows-only code that no Linux runner compiles, let alone runs;
  # Landlock is the mirror image. A single-platform matrix meant every one of those was tested only
  # on whichever machine the author happened to be using.
  test:
    strategy:
      # One platform failing must not cancel the other. When a test breaks on exactly one OS, the
      # other one's result is the most useful thing in the run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # Layer imports, composition root, filesystem boundaries, goroutine
      # launches, context usage, file budgets and the session manager
      # decomposition. This package does not import main, so it needs no
      # frontend/dist.
      - name: Architecture checks
        run: go test ./test/unit/architecture/... -count=1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Unit tests
        # -timeout: see the test-go comment in the Makefile.
        run: go test ./... -race -count=1 -timeout 30m

      # Linux only, and not because they would fail elsewhere: the floors and the benchmark
      # thresholds are platform-independent, so running them twice buys a second identical number
      # and a slower pull request.
      - name: Plugin coverage gates
        if: runner.os == 'Linux'
        run: go run ./scripts/coverage

      - name: Benchmark smoke
        if: runner.os == 'Linux'
        run: go test ./test/bench/... -bench=. -benchtime=100ms

  # Relative links between documents, the files they point at, and the headings they point into.
  # Offline: only the checkout is consulted, so a third party's outage can never fail a pull
  # request - links.yml checks the http half on a schedule instead. Fragments are included because
  # a link into a heading that has been renamed is as broken as one to a deleted file, and heading
  # text is edited far more often than a filename.
  #
  # Runs on Linux, which is the point: the filesystem here is case-sensitive and GitHub's renderer
  # is too, so a link that only resolves on a developer's Windows checkout fails here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # args: --offline --include-fragments --no-progress '*.md' 'docs/**/*.md' 'packaging/**/*.md' '.github/**/*.md' 'frontend/README.md'
          #
          # .gitlab/**/*.md added: the GitLab mirror brought issue and merge request templates, and
          # TestLinkCheckCoversEveryDocument failed on all three the moment they landed - which is
          # the gate doing exactly what it was written for. This args line stays the single source
          # the test parses, so the glob is widened here even though the documents are consumed by
          # the other platform.
          args: --offline --include-fragments --no-progress '*.md' 'docs/**/*.md' 'packaging/**/*.md' '.github/**/*.md' '.gitlab/**/*.md' 'frontend/README.md'
          fail: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm test
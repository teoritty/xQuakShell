name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Layer imports, composition root, filesystem boundaries, goroutine
      # launches, context usage, file budgets and the session manager
      # decomposition. This package does not import main, so it needs no
      # frontend/dist.
      - name: Architecture checks
        run: go test ./test/unit/architecture/... -count=1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Plugin coverage gates
        run: go run ./scripts/coverage

      - name: Benchmark smoke
        run: go test ./test/bench/... -bench=. -benchtime=100ms

  # Relative links between documents, the files they point at, and the headings they point into.
  # Offline: only the checkout is consulted, so a third party's outage can never fail a pull
  # request - links.yml checks the http half on a schedule instead. Fragments are included because
  # a link into a heading that has been renamed is as broken as one to a deleted file, and heading
  # text is edited far more often than a filename.
  #
  # Runs on Linux, which is the point: the filesystem here is case-sensitive and GitHub's renderer
  # is too, so a link that only resolves on a developer's Windows checkout fails here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress '*.md' 'docs/**/*.md' 'packaging/**/*.md' '.github/**/*.md' 'frontend/README.md'
          fail: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm test
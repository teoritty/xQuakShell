name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Layer imports, composition root, filesystem boundaries, goroutine
      # launches, file budgets and the session manager decomposition. This
      # package does not import main, so it needs no frontend/dist.
      - name: Architecture checks
        run: go test ./test/unit/architecture/... -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (for go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Plugin coverage gates
        run: go run ./scripts/coverage

      - name: Benchmark smoke
        run: go test ./test/bench/... -bench=. -benchtime=100ms

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

      - name: Unit tests
        working-directory: frontend
        run: npm test
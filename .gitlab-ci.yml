# xQuakShell - GitLab CI
#
# A port of .github/workflows/*, not a replacement for it. Both files are live: GitHub Actions
# ignores this file, GitLab ignores .github/, and neither platform is the single source of truth
# while the project is mirrored to both. When a gate changes, it changes in BOTH places - a gate
# that is green on one platform and absent on the other is worse than no gate, because the green
# check is read as coverage that does not exist.
#
# What could not be ported, and why, so nobody goes looking for it:
#
#   CodeQL          GitHub's own engine, no GitLab equivalent. The `sast` job below runs GitLab's
#                   analysers (semgrep + gosec) instead. That is NOT parity: CodeQL's dataflow
#                   queries find things semgrep's patterns do not, and the cross-compiled
#                   GOOS=windows pass that security.yml performs has no counterpart here at all.
#                   Windows-only Go code is unanalysed on this platform.
#   Dependabot      Replaced by renovate.json, which reproduces the same groups and schedule.
#   Windows runners gitlab.com offers no shared Windows runner. Every Windows job below is written
#                   out in full and gated behind ENABLE_WINDOWS_CI so that bringing a self-hosted
#                   runner online is a variable flip, not a porting exercise.
#   Scheduled runs  GitLab has no `on: schedule` in the config file. The nightly, mutation and
#                   external-link jobs are here; their cron lives in Build > Pipeline schedules and
#                   selects a job through the SCHEDULE variable. See docs/gitlab-migration.md.
#                   That runbook has since been deleted; the schedule table now lives beside the
#                   scheduled jobs at the bottom of this file, which is the only copy.

# ---------------------------------------------------------------------------
# Pipeline admission
#
# The first rule is a security control, not tidiness. A merge request from a fork is code an
# untrusted author wrote, and running it in THIS project means running it on this project's
# runners with this project's job token. Refusing the pipeline outright is the strongest form of
# that refusal and costs a fork contributor nothing: the pipeline still runs in their own fork,
# on their own runners, and the result is still visible on the merge request.
#
# This duplicates the project setting "Run pipelines for merge request from forks" being off. That
# is deliberate. A setting lives in a web UI where a future click can undo it silently; this line
# is in git, reviewed, and reverting it leaves a diff.
#
# CORRECTION to the paragraph above, which overstated what this rule is worth. It is NOT the
# strongest control and must not be relied on as one: a merge request pipeline is assembled from
# the .gitlab-ci.yml of the SOURCE branch, so on a fork merge request this file is one the fork's
# author controls and can delete the rule from. What the rule actually buys is protection against
# the accident - the project setting flipped by a stray click, or a collaborator enabling fork
# pipelines without understanding the consequence - which is worth having in git and is a different
# claim from stopping an attacker.
#
# The two controls that an outside author genuinely cannot reach are the project setting itself and
# --access-level ref_protected on BOTH runners: a merge request pipeline runs on
# refs/merge-requests/N/head, which is never a protected ref, so a protected runner refuses the job
# while selecting a runner - before a line of the submitted YAML is read. docs/gitlab-migration.md
# carries the full model.
#
# That runbook no longer exists. The rest of the model is not restated here because it is not
# configuration: it is four project settings - fork pipelines off, shared runners off, job token
# scoped to this project, and protected branches `*` with protected tags `v*`. The last one is the
# pair to ref_protected: without it no ref is protected, so neither runner accepts anything.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_PROJECT_PATH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Without this a push to a branch that already has an open merge request builds twice - once
    # as a branch pipeline, once as a merge request pipeline - for one identical result.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - test
  - security
  - release

variables:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"
  # Pinned, never @latest, so a local `make` run and a pipeline agree on the finding set.
  # Keep equal to the versions in the Makefile and .github/workflows/security.yml.
  GOVULNCHECK_VERSION: "v1.6.0"
  GOSEC_VERSION: "v2.28.0"
  STATICCHECK_VERSION: "v0.7.0"
  # Kept equal to the wails/v2 version in go.mod, which test/unit/release asserts.
  WAILS_VERSION: "v2.13.0"
  # GOPATH inside the project directory is what makes the module cache cacheable: GitLab can only
  # cache paths under CI_PROJECT_DIR.
  # GOPATH: "$CI_PROJECT_DIR/.go"
  #
  # That traded a cache for two broken gates, and the gates were right. Putting a dependency tree
  # inside the checkout means every test that walks the checkout walks the dependencies too:
  #
  #   TestCompositionRoot            "parse .go: read /builds/.../.go: is a directory" - the
  #                                  directory is literally named `.go`, so it matches the *.go
  #                                  suffix the parser selects on.
  #   TestLinkCheckCoversEveryDocument  found 70-odd README.md files under .go/pkg/mod and asked,
  #                                  correctly, why the link gate does not cover them.
  #
  # Renaming it would fix the first and not the second. GOPATH belongs outside the checkout, which
  # is where the golang image already puts it, so this now simply does not override it. The cost is
  # a module download per job; the alternative is a checkout that no longer describes the project.
  #
  # GOPATH is therefore left at the image default, /go, and no longer set here at all.
  GOFLAGS: "-mod=readonly"
  # GIT_DEPTH: "0"
  #
  # 0 means unlimited: every job cloned the entire history. Nothing here needs it - the only code
  # in this repository that shells out to git is scripts/budgets, and `git ls-files` reads the
  # index rather than the history, so it is unaffected by a shallow clone.
  #
  # It was actively harmful on the Windows runner, where git's schannel backend fails a large
  # transfer with "server closed abruptly (missing close_notify)" often enough to be the top cause
  # of red jobs. A full clone maximises the surface for that. 20 is GitLab's own default depth.
  GIT_DEPTH: "20"

# ---------------------------------------------------------------------------
# Job templates
# ---------------------------------------------------------------------------

.go:
  image: golang:${GO_VERSION}
  # cache:
  #   key:
  #     files:
  #       - go.sum
  #   paths:
  #     - .go/pkg/mod
  #
  # Removed with the GOPATH override above: a GitLab cache path must live under CI_PROJECT_DIR, and
  # nothing that a test walks may live there. Restoring a Go cache means finding somewhere outside
  # the checkout that GitLab will cache, and there is no such place - so this stays uncached until
  # slow jobs make the problem worth solving properly.
  before_script:
    - go version

.node:
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  before_script:
    - npm --version

# Every Go job that type-checks the whole module needs frontend/dist to exist, because main.go
# go:embed's it and the directory is gitignored. GitHub rebuilds the frontend inside each job;
# here it is built once in the check stage and passed down as an artifact, which is the same
# result for a quarter of the compute minutes.
.needs-frontend-dist:
  needs:
    - job: frontend:build
      artifacts: true

# A Windows job cannot run on gitlab.com's shared runners, and a self-hosted Windows runner must
# never be reachable from an untrusted pipeline. Both conditions are enforced here: the job is off
# unless ENABLE_WINDOWS_CI is set, and it only ever runs on a runner carrying the
# `xquakshell-windows` tag, which is a runner the project owner registered and controls.
#
# Register that runner as PROTECTED. The tag says which runner; protected says which refs may
# reach it. Without the protected flag, any branch in this project - including one pushed by a
# future collaborator - executes on the owner's physical machine.
#
# The Linux runner is registered protected too, and the paragraph above is the reason it has to be:
# with gitlab.com's shared runners disabled for this project, an unprotected Linux runner would be
# the one runner still willing to take an untrusted job. That moves the exposure off the Windows
# machine rather than closing it.
.windows:
  tags:
    - xquakshell-windows
  rules:
    - if: $ENABLE_WINDOWS_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH != $CI_PROJECT_PATH
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Stage: check
# ---------------------------------------------------------------------------

# Layer imports, composition root, filesystem boundaries, goroutine launches, context usage, file
# budgets and the session manager decomposition. This package does not import main, so it is the
# one Go job that needs no frontend/dist - which also makes it the fastest way to fail a pipeline
# that was never going to pass.
architecture:
  extends: .go
  stage: check
  script:
    - go test ./test/unit/architecture/... -count=1

frontend:build:
  extends: .node
  stage: check
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - frontend/dist

frontend:typecheck:
  extends: .node
  stage: check
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run check

frontend:test:
  extends: .node
  stage: check
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm test

# Relative links between documents, the files they point at, and the headings they point into.
# Offline: only the checkout is consulted, so a third party's outage can never fail a merge
# request - the `links:external` job below checks the http half on a schedule instead. Fragments
# are included because a link into a renamed heading is as broken as one to a deleted file, and
# heading text is edited far more often than a filename.
#
# The container filesystem is case-sensitive and both renderers are too, so a link that only
# resolves on the author's Windows checkout fails here. That is the point of running it in CI.
docs:links:
  stage: check
  image:
    name: lycheeverse/lychee:latest
    entrypoint: [""]
  script:
    - >
      lychee --offline --include-fragments --no-progress
      '*.md' 'docs/**/*.md' 'packaging/**/*.md' '.github/**/*.md' '.gitlab/**/*.md' 'frontend/README.md'

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------

# The Linux half of what .github/workflows/test.yml runs across two operating systems. Coverage
# floors and benchmark thresholds are platform-independent, so GitHub runs them on Linux only and
# so does this.
#
# The Windows half is `go:test:windows` below, and while that job is disabled this is a real gap
# rather than a stylistic one: the AppContainer profile, its ACLs, the job object and the Windows
# arm of the sandbox escape probe are Windows-only code that no Linux runner compiles.
go:test:
  extends:
    - .go
    - .needs-frontend-dist
  stage: test
  script:
    - go test ./... -race -count=1
    - go run ./scripts/coverage
    - go test ./test/bench/... -bench=. -benchtime=100ms

go:test:windows:
  extends:
    - .windows
    - .needs-frontend-dist
  stage: test
  # -race on Windows is implemented in the cgo runtime, so the toolchain refuses it outright with
  # "-race requires cgo; enable cgo by setting CGO_ENABLED=1". GitHub's windows-latest image ships
  # a mingw-w64 gcc and has cgo on by default, which is why test.yml never had to say this.
  #
  # Dropping -race here instead would be the wrong trade: the Windows-only code - AppContainer, its
  # ACLs, the job object - is exercised by no other job on any platform, so this is the only place
  # a data race in it can be detected at all.
  #
  # The runner therefore needs a C compiler: choco install -y mingw.
  variables:
    CGO_ENABLED: "1"
  script:
    - go test ./test/unit/architecture/... -count=1
    - go test ./... -race -count=1

# ---------------------------------------------------------------------------
# Stage: security
# ---------------------------------------------------------------------------

# GitLab's own analysers, included as the nearest available stand-in for the CodeQL job in
# .github/workflows/security.yml. Read the header of this file before treating the two as
# equivalent - they are not, and the difference is in what semgrep's patterns cannot see.
#
# The template places its jobs in the `test` stage, which is why that stage is named exactly that.
include:
  - template: Security/SAST.gitlab-ci.yml

# All three tools type-check the packages and the root package go:embed's frontend/dist, so they
# share one job and one frontend artifact rather than three.
#
# Every step runs even when an earlier one failed, so a single run surfaces every finding instead
# of one tool per pipeline. That is what `- !` around the failing commands buys; the gates at the
# end are what actually turn the job red.
sec:go:
  extends:
    - .go
    - .needs-frontend-dist
  stage: security
  script:
    # - apt-get update -qq && apt-get install -y -qq jq
    #
    # The image's sources point at http://deb.debian.org, and port 80 to Fastly does not survive
    # this network - apt then warns rather than failing, carries on with no index, and the job dies
    # four lines later on "Unable to locate package jq". Rewriting the sources to https fixes it and
    # is worth doing on its own merits: an unauthenticated plaintext fetch of packages that are
    # about to run as root in the job is not something to keep because it happened to work.
    #
    # Two paths because trixie moved to the deb822 format and older images still use sources.list.
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
    - sed -i 's|http://|https://|g' /etc/apt/sources.list 2>/dev/null || true
    - apt-get update -qq && apt-get install -y -qq jq

    # Reports only vulnerabilities whose vulnerable symbols are reachable from this code, so a
    # finding here is worth acting on.
    - go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./... || GOVULN_FAILED=1

    # -no-fail so the SARIF is always written; the gate below is what fails the build.
    #
    # Three rules are excluded repo-wide because they do not describe a defect in an SSH/SFTP
    # client, and per-site annotations would run to ~75 comments nobody would read. Everything
    # else is annotated at the call site, so a NEW offending call site still fails the build:
    #   G104 unhandled errors  - the convention here is deliberate best-effort Close/Remove in
    #                            cleanup and error paths; duplicates errcheck, not a finding.
    #   G304 file inclusion    - the product IS a file manager; user-chosen paths are the input.
    #                            Containment is enforced by internal/pkg/pathsafe (UnderRoot) and
    #                            by test/unit/architecture/fs_boundaries.go.
    #   G103 unsafe.Pointer    - required to pass syscall arguments to windows.OpenProcess /
    #                            SetInformationJobObject.
    - >
      go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
      -no-fail -fmt sarif -out gosec.sarif
      -exclude-dir=test/fixtures -exclude-dir=frontend -exclude-dir=build
      -exclude=G104,G304,G103
      ./...

    # `-f sarif` reports findings through the file rather than the exit code, so exit 1 is
    # tolerated and the gate below is what fails the build. Anything above 1 is a real tool
    # failure and must NOT be swallowed - a blanket `|| true` turns a broken run into a truncated
    # file that blows up two steps later.
    #
    # The jq pass exists because staticcheck omits the "results" key entirely on a clean run.
    # SARIF 2.1.0 allows that, but `.runs[].results[]` then iterates over null.
    - |
      set +e
      go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} -f sarif ./... > staticcheck.raw.sarif
      status=$?
      set -e
      if [ "$status" -gt 1 ]; then cat staticcheck.raw.sarif; exit "$status"; fi
      jq '.runs |= map(.results = (.results // []))' staticcheck.raw.sarif > staticcheck.sarif

    # Findings are printed before the count is asserted because, unlike a GitHub SARIF upload,
    # nothing else in this job's log names them.
    - |
      for report in gosec.sarif staticcheck.sarif; do
        count=$(jq '[.runs[].results[]] | length' "$report")
        if [ "$count" -ne 0 ]; then
          jq -r '.runs[].results[]
            | "\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)\t\(.message.text)"' "$report"
          echo "$report reported $count finding(s)"
          exit 1
        fi
      done
    - test -z "$GOVULN_FAILED"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gosec.sarif
      - staticcheck.sarif

sec:frontend:
  extends: .node
  stage: security
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline

    # Scoped to frontend/ deliberately: frontend/wailsjs/runtime/package.json is a generated,
    # lockfile-less manifest and must not be audited.
    #
    # --omit=dev is a deliberate narrowing, not a way to dodge a red build. What is left in
    # devDependencies is vite, esbuild and their transitives - a website talking to the vite DEV
    # SERVER. This app ships `npm run build` output embedded in the Go binary and never runs the
    # dev server for users, so that is a local-developer surface only.
    #
    # moderate, not high, and the difference is the whole point of this step. `svelte` is declared
    # as a devDependency but its runtime ships in the bundle, so it sits in the production tree -
    # and at 3.49 it carried two client-side advisories a `high` threshold silently passed over:
    #
    #   GHSA-8266-84wp-wv5c  mXSS via improper HTML escaping             fixed in 4.2.19
    #   GHSA-rcqx-6q8c-2c42  XSS via DOM clobbering of framework state   fixed in 5.55.7
    #
    # Both mattered more than "moderate" suggests, because of one sink: a plugin README fetched
    # from GitHub reaches {@html} in GitHubReadmePanel.svelte, inside a WebView bound to the whole
    # Wails API. Raising this back to `high` re-opens that blind spot.
    - npm audit --omit=dev --audit-level=moderate

# Non-blocking, so the dev-dependency backlog stays visible in a job log instead of quietly
# disappearing behind --omit=dev.
sec:frontend:informational:
  extends: .node
  stage: security
  allow_failure: true
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm audit

# ---------------------------------------------------------------------------
# Stage: release
#
# Runs on a tag, and on a manual pipeline for a dry run. A tag is permanent and a published
# release is public the instant it is created, so there has to be a way to prove the build works
# before creating either: a `web` pipeline builds every archive and keeps it as a job artifact,
# while `release:publish` refuses to run without a tag and so can never create a release.
# ---------------------------------------------------------------------------

.release-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

# A tag is permanent, so this is the last point at which "nobody wrote down what changed" can
# still be caught. Without it a release note is a list of commit subjects, which leaves a plugin
# author no way to tell whether their plugin still loads on this build.
#
# The test suite holds wails.json against the changelog on every commit; only the tag can be
# compared here, because an ordinary commit does not have one.
release:changelog:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - apk add --no-cache bash grep coreutils gawk
    - |
      set -uo pipefail
      version="${CI_COMMIT_TAG#v}"

      start=$(grep -n "^## \[$version\]" CHANGELOG.md | head -1 | cut -d: -f1)
      if [ -z "$start" ]; then
        echo "CHANGELOG.md has no '## [$version]' section for tag $CI_COMMIT_TAG" >&2
        exit 1
      fi

      heading=$(sed -n "${start}p" CHANGELOG.md)
      case "$heading" in
        *[Uu]nreleased*)
          echo "the changelog entry for $version is still marked unreleased: $heading" >&2
          exit 1
          ;;
      esac

      section=$(tail -n +"$((start + 1))" CHANGELOG.md | awk '/^## \[/ { exit } { print }')
      for required in '### Compatibility' '### BREAKING'; do
        if ! printf '%s\n' "$section" | grep -qF "$required"; then
          echo "the changelog entry for $version has no '$required' block" >&2
          exit 1
        fi
      done

      product=$(grep -o '"productVersion"[[:space:]]*:[[:space:]]*"[^"]*"' wails.json | sed 's/.*"\([^"]*\)"$/\1/')
      if [ "$product" != "$version" ]; then
        echo "wails.json productVersion is $product but the tag is $version" >&2
        exit 1
      fi

      echo "changelog entry for $version is complete"

# WebKitGTK is linked from the system and cannot be bundled the way WebView2 is on Windows, and
# the 4.0 and 4.1 ABIs are not interchangeable: a binary built against one does not start against
# the other. So the Linux side ships one archive per ABI rather than one archive that fails on
# half the distributions.
#
# One deliberate divergence from .github/workflows/release.yml, recorded here because it changes
# what the artifact runs on: GitHub builds on ubuntu-22.04 (glibc 2.35), this builds in
# golang:1.26-bookworm (glibc 2.36). The runner image sets the glibc FLOOR of what it produces, so
# a GitLab-built archive will not start on a system that a GitHub-built one would. Until the two
# platforms agree, GitHub remains the source of published Linux archives; this job exists to prove
# the build is not broken and to cover the case where it becomes the only one available.
release:linux:
  extends:
    - .go
    - .release-rules
  stage: release
  image: golang:${GO_VERSION}-bookworm
  parallel:
    matrix:
      - WEBKIT: "4.0"
        DEV_PACKAGE: libwebkit2gtk-4.0-dev
        BUILD_TAGS: ""
      - WEBKIT: "4.1"
        DEV_PACKAGE: libwebkit2gtk-4.1-dev
        # Without this tag Wails links 4.0 regardless of what is installed.
        BUILD_TAGS: "-tags webkit2_41"
  before_script:
    # - apt-get update -qq
    #
    # Same failure sec:go already carries: the image's sources point at http://deb.debian.org, port
    # 80 to Fastly does not survive this network, and apt only warns - so the job dies two lines
    # later on "Unable to locate package libgtk-3-dev". Rewriting the sources to https fixes it and
    # is worth doing anyway: these packages are installed as root in the job.
    #
    # Two paths because trixie moved to the deb822 format and older images still use sources.list.
    - sed -i 's|http://|https://|g' /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
    - sed -i 's|http://|https://|g' /etc/apt/sources.list 2>/dev/null || true
    - apt-get update -qq
    - apt-get install -y -qq curl libgtk-3-dev "$DEV_PACKAGE"
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y -qq nodejs
    # Pinned for the same reason as everything else here: two runs of the same tag must agree.
    - go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
  script:
    # Archive names keep the leading "v"; the version compiled into the binary drops it. On a
    # manual run there is no tag, so name those archives something that cannot be mistaken for a
    # build of a release.
    - |
      TAG="${CI_COMMIT_TAG:-dryrun-$(echo "$CI_COMMIT_SHA" | cut -c1-7)}"
      VERSION="${TAG#v}"
      NAME="xQuakShell-$TAG-linux-amd64-webkit${WEBKIT}"
    - wails build -platform linux/amd64 -clean $BUILD_TAGS -ldflags "-X xquakshell/internal/presentation/wails.AppVersion=$VERSION"
    # An ELF on its own has no icon, no menu entry and no explanation of which WebKitGTK it needs.
    # The archive carries the launcher, the desktop entry and the instructions with it.
    - |
      mkdir -p dist "stage/$NAME"
      cp build/bin/xQuakShell "stage/$NAME/"
      cp packaging/linux/xquakshell.sh "stage/$NAME/"
      cp packaging/linux/install-desktop-entry.sh "stage/$NAME/"
      cp packaging/linux/xquakshell.desktop "stage/$NAME/"
      cp packaging/linux/README.md "stage/$NAME/README.md"
      cp images/icon.png "stage/$NAME/icon.png"
      cp LICENSE "stage/$NAME/"
      # core.filemode is false in this repository and the scripts are tracked 0644, so the
      # executable bit does not survive checkout; tar would record exactly that.
      chmod +x "stage/$NAME/xQuakShell" "stage/$NAME/xquakshell.sh" "stage/$NAME/install-desktop-entry.sh"
      # -C keeps the staging path out of the archive: it unpacks into one directory named after
      # itself, never into the current one.
      tar -czf "dist/$NAME.tar.gz" -C stage "$NAME"
      tar -tzf "dist/$NAME.tar.gz"
  artifacts:
    expire_in: 30 days
    paths:
      - dist/

# The Windows half of the release. Disabled until ENABLE_WINDOWS_CI is set and a runner tagged
# `xquakshell-windows` exists, because gitlab.com has no shared Windows runner. Written out in
# full anyway: a release that can only be cut on one platform is a release that stops being cut
# the day that platform is unavailable, which is the situation this whole file exists to answer.
release:windows:
  extends: .windows
  stage: release
  rules:
    - if: $ENABLE_WINDOWS_CI != "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - go install github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION
    - |
      $tag = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "dryrun-" + $env:CI_COMMIT_SHA.Substring(0, 7) }
      $version = $tag -replace '^v', ''
      $env:TAG = $tag
      $env:VERSION = $version
    - wails build -platform windows/amd64 -clean -ldflags "-X xquakshell/internal/presentation/wails.AppVersion=$env:VERSION"
    # Both archives unpack into one folder named after themselves rather than scattering an exe
    # and a 250 MB runtime folder into whatever directory they were opened in. The app keeps its
    # vault, audit log and plugins in data\ next to the executable, so that folder is the
    # installation and has to stay together.
    - |
      $name = "xQuakShell-$env:TAG-windows-amd64-portable"
      New-Item -ItemType Directory -Path dist, "stage/$name" -Force | Out-Null
      Copy-Item "build/bin/xQuakShell.exe" "stage/$name/"
      Copy-Item "packaging/windows/README.md" "stage/$name/README.md"
      Copy-Item "LICENSE" "stage/$name/"
      Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
    # Fetches the x64 fixed runtime, verifies it is the architecture this build needs and that
    # Microsoft signed it, and fails the release if either is not true.
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/download_webview2.ps1
    - |
      $name = "xQuakShell-$env:TAG-windows-amd64-portable-webview2"
      New-Item -ItemType Directory -Path "stage/$name" -Force | Out-Null
      Copy-Item "build/bin/xQuakShell.exe" "stage/$name/"
      Copy-Item "build/bin/WebView2" "stage/$name/WebView2" -Recurse
      Copy-Item "packaging/windows/README.md" "stage/$name/README.md"
      Copy-Item "LICENSE" "stage/$name/"
      # The file Wails resolves at startup. If it is missing the app exits without a window, which
      # is exactly the failure this archive exists to prevent - so the release stops here rather
      # than shipping it.
      $clientDll = "stage/$name/WebView2/EBWebView/x64/EmbeddedBrowserWebView.dll"
      if (-not (Test-Path $clientDll)) { throw "Bundled runtime is missing $clientDll" }
      Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
  artifacts:
    expire_in: 30 days
    paths:
      - dist/

# GitLab releases attach assets by URL, not by upload, so every archive goes to the project's
# generic package registry first and the release links to it there. No pattern filter on the
# collection step: every archive any build job produced is published and checksummed, so a new
# platform job cannot be added without its files being covered.
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: release:changelog
    - job: release:linux
      artifacts: true
    - job: release:windows
      artifacts: true
      optional: true
  before_script:
    # The release-cli image carries release-cli and busybox and nothing else, so the upload below
    # died with "curl: not found" on the first tag that reached this job - after every archive had
    # already been built. busybox wget is no substitute: the generic package registry takes a PUT
    # and wget cannot send one. The image is Alpine-based, so apk is the way to get curl.
    - apk add --no-cache curl
  script:
    # Superseded, kept because both faults are easy to reintroduce:
    #
    #   1. The first block cd's into dist and writes ../release-links.args, so the file lands in the
    #      project root; the second block runs in the same shell, is therefore still in dist, and
    #      reads release-links.args from there. Under set -eu that is a failed job - on a tag, which
    #      is permanent. Nothing in the pipeline would have caught it before it happened.
    #   2. eval on a string holding JSON. It survives only while no filename and no field contains a
    #      space, and the quoting that would make it safe is unreadable.
    #
    # - |
    #   set -eu
    #   version="${CI_COMMIT_TAG#v}"
    #   base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/xquakshell/${version}"
    #   cd dist
    #   sha256sum * > SHA256SUMS
    #   cat SHA256SUMS
    #   links=""
    #   for f in *; do
    #     curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${base}/${f}"
    #     links="${links} --assets-link {\"name\":\"${f}\",\"url\":\"${base}/${f}\"}"
    #   done
    #   echo "$links" > ../release-links.args
    # - |
    #   set -eu
    #   name="$CI_COMMIT_TAG"
    #   case "$CI_COMMIT_TAG" in *-*) name="$CI_COMMIT_TAG (pre-release)" ;; esac
    #   eval release-cli create --name "'$name'" --tag-name "$CI_COMMIT_TAG" \
    #     --description "\"See CHANGELOG.md for the ${CI_COMMIT_TAG#v} entry.\"" \
    #     $(cat release-links.args)
    - |
      set -eu
      version="${CI_COMMIT_TAG#v}"
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/xquakshell/${version}"

      cd dist
      # Runs before SHA256SUMS exists, so the glob cannot include the file being written.
      sha256sum * > SHA256SUMS
      cat SHA256SUMS

      # One block, and positional parameters rather than a string handed to eval: every argument is
      # carried whole, so a space anywhere in a name cannot split it into two, and there is no
      # second shell invocation to get the working directory wrong between.
      set --
      for f in *; do
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${base}/${f}"
        set -- "$@" --assets-link "{\"name\":\"${f}\",\"url\":\"${base}/${f}\"}"
      done

      # Tagged with a suffix (v1.0.0-rc.1) is a pre-release; GitLab has no flag for that, so the
      # distinction lives in the release name rather than a checkbox.
      name="$CI_COMMIT_TAG"
      case "$CI_COMMIT_TAG" in *-*) name="$CI_COMMIT_TAG (pre-release)" ;; esac

      release-cli create --name "$name" --tag-name "$CI_COMMIT_TAG" \
        --description "Release notes: ${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md" "$@"

# ---------------------------------------------------------------------------
# Scheduled work
#
# GitLab has no `on: schedule` in the config file, so the cron lives in Build > Pipeline schedules
# and each schedule sets SCHEDULE to pick exactly one job. Three schedules reproduce the three
# scheduled GitHub workflows; docs/gitlab-migration.md has the cron expressions to enter.
#
# That runbook was deleted, so the expressions are here and this is the only copy. Create these
# under Build > Pipeline schedules, each with the one variable shown; the times match the GitHub
# workflows they replace.
#
#   Nightly build      0 1 * * *    SCHEDULE=nightly           replaces nightly.yml
#   Mutation testing   17 3 * * *   SCHEDULE=mutation          replaces mutation.yml
#   External links     0 7 * * 1    SCHEDULE=links             replaces links.yml
#
# A fourth is created INACTIVE and run by hand from the schedule list when a mutation baseline
# needs re-recording: SCHEDULE=mutation-update. It uploads scripts/mutate/baseline.json as an
# artifact and stops there. Committing it stays a manual step, because a job that pushes to its own
# repository is a job that can rewrite the thing it was measuring.
#
# None of these is a merge gate, and none should become one. A mutation run reruns a test suite
# once per mutant and takes tens of minutes to hours; blocking a merge on it makes the gate the
# thing people work around.
# ---------------------------------------------------------------------------

# The http half of the link checking that docs:links does offline on every merge request.
#
# Deliberately not a merge-request gate. An external site going down, rate-limiting a CI runner or
# moving a page is not a defect in the branch being reviewed, and a gate that fails for reasons
# the author cannot fix is one people learn to ignore. A failed scheduled run is the notification.
#
# The project-path guard is inherited from the GitHub original: a fork inherits the schedule but
# not the intent, and every fork checking the same URLs is how a host decides this project is
# worth rate-limiting.
links:external:
  stage: check
  image:
    name: lycheeverse/lychee:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "links" && $CI_PROJECT_PATH == "teoritty/xQuakShell"
  script:
    # 429 counts as reachable: a host that rate-limits a CI runner has answered, and treating that
    # as a dead link would make the weekly result depend on who else ran this hour.
    - >
      lychee --cache --max-cache-age 1d --no-progress --accept 200,206,429
      '*.md' 'docs/**/*.md' 'packaging/**/*.md' '.github/**/*.md' '.gitlab/**/*.md' 'frontend/README.md'

# Mutation testing answers a question line coverage cannot: would the tests have noticed if the
# code were wrong? A red run here is not a broken build - it means a test stopped catching
# something it used to, which is worth a morning's attention rather than an immediate revert.
#
# ONLY goes through the environment rather than the command line. A pipeline variable interpolated
# straight into a shell command is an injection with extra steps, and the fact that only a
# maintainer can set one is not the same as it being safe.
nightly:mutation:go:
  extends:
    - .go
    - .needs-frontend-dist
  stage: test
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "mutation"
  script:
    # Not part of any merge gate: a fuzz target is a search, not an assertion, and a search that
    # finds nothing tonight may find something tomorrow on the same code. The seed corpus in
    # testdata is what protects a merge request; this is what grows it.
    - go test ./internal/infra/plugin/sandbox/ -run=FuzzParseShimArgs -fuzz=FuzzParseShimArgs -fuzztime=60s
    - go run ./scripts/mutate -only="${ONLY:-}"

# Recording a baseline needs a run on the platform that will check it, so the numbers are produced
# here and committed by hand from the artifact - this job does not push.
nightly:mutation:go:update:
  extends: nightly:mutation:go
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "mutation-update"
  script:
    - go run ./scripts/mutate -update -only="${ONLY:-}"
  artifacts:
    expire_in: 30 days
    paths:
      - scripts/mutate/baseline.json

# A measured local run is 1997 mutants in about 2h15m, and every mutant reruns the whole suite.
nightly:mutation:frontend:
  extends: .node
  stage: test
  timeout: 5h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "mutation"
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run mutate

# The build half of .github/workflows/nightly.yml, and only the build half. That workflow also
# publishes a rolling `nightly` GitHub release, deleting the previous one each night. This does
# not: GitLab releases are immutable by tag and the delete-and-recreate dance costs more than a
# mirror is worth. The archives are here as job artifacts, which is where anyone reproducing a
# nightly failure needs them; GitHub remains where a nightly is published.
nightly:build:linux:
  extends: release:linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "nightly"
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
